<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up - Spotify</title>
    <link rel="stylesheet" href="/Css/SignUp.css" />
  </head>

  <body>
    <section class="first-section">
      <div class="container">
        <div class="hold">
          <img
            class="logo"
            src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg"
            alt="Spotify"
          />

          <h1 class="title">
            Sign up to<br />
            start listening
          </h1>
        </div>

        <div class="number">
          <h2 class="phone">Phone number</h2>

          <form>
            <div class="input">
              <select class="country-code">
                <option>234</option>
                <option>+1</option>
                <option>+44</option>
                <option>+91</option>
              </select>

              <input class="phone-input" type="tel" required />
            </div>

            <a href="openSpotify.html" class="continue-link">
              <button class="continue" type="button">
                <h3>Continue</h3>
              </button>
            </a>
          </form>
        </div>

        <div class="or">
          <p>or</p>
        </div>

        <div class="social">
          <button class="socials" type="button">
            <h2 class="email-icon">✉</h2>
            <h3>Sign up with email</h3>
          </button>

          <button class="socials" type="button">
            <h2 class="google-icon">G</h2>
            <h3>Sign up with Google</h3>
          </button>

          <button class="socials" type="button">
            <h2 class="apple-icon">●</h2>
            <h3>Sign up with Apple</h3>
          </button>
        </div>

        <div class="login">
          <p>Already on Spotify?</p>
          <a href="Login.html">Log In</a>
        </div>

        <p class="recaptcha">
          This site is protected by reCAPTCHA and the Google
          <a href="https://policies.google.com/privacy">Privacy</a>
        </p>
      </div>
    </section>
  </body>
</html>
