<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Spotify</title>
    <link rel="stylesheet" href="/Css/logIn.css" />
  </head>

  <body>
    <section class="first-section">
      <div class="container">
        <div class="hold">
          <img
            class="spotify-logo"
            src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg"
            alt="Spotify"
          />

          <h1 class="title">Welcome back</h1>
        </div>

        <div class="email">
          <h2 class="email-title">Email</h2>

          <form>
            <input class="email-input" type="email" required />

            <a href="openSpotify.html" class="continue-link">
              <button class="continue-btn" type="button">
                <h3>Continue</h3>
              </button>
            </a>
          </form>
        </div>

        <div class="or">
          <p>or</p>
        </div>

        <div class="social-buttons">
          <button class="social-btn" type="button">
            <h2 class="phone-icon">▯</h2>
            <h3>Continue with phone number</h3>
          </button>

          <button class="social-btn" type="button">
            <h2 class="google-icon">G</h2>
            <h3>Continue with Google</h3>
          </button>

          <button class="social-btn" type="button">
            <h2 class="facebook-icon">f</h2>
            <h3>Continue with Facebook</h3>
          </button>

          <button class="social-btn" type="button">
            <h2 class="apple-icon">●</h2>
            <h3>Continue with Apple</h3>
          </button>
        </div>

        <div class="signup">
          <p>Don't have an account?</p>
          <a href="signUp.html">Sign up</a>
        </div>

        <p class="recaptcha">
          This site is protected by reCAPTCHA and the Google
          <a href="https://policies.google.com/privacy">Privacy Policy</a>
          and
          <a href="https://policies.google.com/terms">Terms of Service</a>
          apply.
        </p>
      </div>
    </section>
  </body>
</html>
